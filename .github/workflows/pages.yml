name: Deploy Citadel to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build immutable static artifact
        env:
          CITADEL_BUILD: ${{ github.sha }}
        run: |
          rm -rf dist
          mkdir -p dist/src
          cp index.html styles.css dist/
          cp src/*.js dist/src/

          python - <<'PY'
          import os
          import pathlib
          import re

          build = os.environ["CITADEL_BUILD"]
          root = pathlib.Path("dist")

          index = root / "index.html"
          text = index.read_text()
          text = text.replace('content="development" data-citadel-build', f'content="{build}" data-citadel-build')
          text = re.sub(r'href="\.\/styles\.css(?:\?[^"]*)?"', f'href="./styles.css?v={build}"', text)
          text = re.sub(r'src="\.\/src\/app\.js(?:\?[^"]*)?"', f'src="./src/app.js?v={build}"', text)
          index.write_text(text)

          for path in (root / "src").glob("*.js"):
              source = path.read_text()
              source = re.sub(
                  r'(from\s+["\'])(\.\/[^"\']+\.js)(?:\?[^"\']*)?(["\'])',
                  lambda m: f'{m.group(1)}{m.group(2)}?v={build}{m.group(3)}',
                  source,
              )
              source = re.sub(
                  r'(import\s*\(\s*["\'])(\.\/[^"\']+\.js)(?:\?[^"\']*)?(["\']\s*\))',
                  lambda m: f'{m.group(1)}{m.group(2)}?v={build}{m.group(3)}',
                  source,
              )
              path.write_text(source)

          (root / "build.json").write_text(
              '{"build":"' + build + '","source":"github-actions"}\n'
          )
          PY

      - name: Verify built asset versioning
        env:
          CITADEL_BUILD: ${{ github.sha }}
        run: |
          grep -q "styles.css?v=$CITADEL_BUILD" dist/index.html
          grep -q "app.js?v=$CITADEL_BUILD" dist/index.html
          if grep -R -E 'from ["'"'"']\./[^"'"'"']+\.js["'"'"']' dist/src; then
            echo "Found an unversioned local module import."
            exit 1
          fi

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
